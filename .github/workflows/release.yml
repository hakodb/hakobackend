# Release: server binaries on every `v*` tag (+ manual dispatch for testing).
#
# Windows: MSVC binary, as before.
#
# Linux: ONE fully-static musl binary (not a per-distro matrix like
# hakodb's .so assets — a static binary has no glibc floor at all, so
# it runs on EL7/EL8/ubuntu/Alpine alike, which is exactly the fleet
# spread: EL7 needs glibc <= 2.17, so no glibc build can serve it).
# Built in an Alpine container (musl-native toolchain + static openssl
# + static sqlite from apk — no source builds, no version picks).
# Tradeoffs, stated plainly:
# - OpenSSL/SQLite CVEs embed into the binary: fix = rebuild +
#   re-release (same as any static release; watch the advisories).
# - Asset name is the deploy script's contract:
#   hakobackend-<tag>-linux-x86_64.tar.gz containing `hakobackend`.
#
# No crates.io involved (13 path-crates would all need publishing, in
# order, on every change — pure churn for a binary people run).
# Distribution = GitHub Release assets here (+ GHCR images in docker.yml).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked -p hakobackend-server --target ${{ matrix.target }}

      - name: package (windows)
        shell: pwsh
        run: |
          $STAGE = "hakobackend-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hakobackend-server.exe" "$STAGE/hakobackend.exe"
          Copy-Item hakobackend.example.toml $STAGE -ErrorAction SilentlyContinue
          Compress-Archive $STAGE "$STAGE.zip"

      - name: upload release assets
        # ponytail: tags only — manual dispatches exercise the build
        # without publishing half-tested artifacts to a release.
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hakobackend-*.zip
          generate_release_notes: true

  linux-musl-static:
    # Fully static server binary (runs on EL7/EL8/ubuntu/Alpine —
    # proven target: the EL7 fleet box, glibc 2.17, which no glibc
    # build can serve). Alpine provides the musl C/C++ toolchain and
    # static system libs as packages; rustup runs inside the container.
    runs-on: ubuntu-latest
    container:
      image: alpine:3.21
    steps:
      - name: container toolchain (musl C/C++, static openssl/sqlite, perl/cmake for aws-lc-sys)
        run: apk add --no-cache musl-dev gcc g++ perl cmake make pkgconfig git curl tar gzip ca-certificates openssl-dev openssl-libs-static sqlite-dev sqlite-static protobuf rustup bash file
      - uses: actions/checkout@v4
      - name: rust toolchain + musl target
        # ponytail: rustup (not dtolnay) inside alpine — the action's
        # rustup-init assumes glibc; alpine needs the musl rustup build,
        # which plain rustup handles natively.
        run: |
          rustup-init -y --default-toolchain stable --profile minimal --target x86_64-unknown-linux-musl
          source "$HOME/.cargo/env"
          rustc -vV
      - name: build (static)
        run: |
          source "$HOME/.cargo/env"
          export OPENSSL_STATIC=1
          export RUSTFLAGS="-C target-feature=+crt-static -C link-self-contained=yes"
          cargo build --release --locked -p hakobackend-server --target x86_64-unknown-linux-musl
      - name: prove static
        run: |
          source "$HOME/.cargo/env"
          BIN=target/x86_64-unknown-linux-musl/release/hakobackend-server
          file "$BIN"
          ./$BIN --help >/dev/null && echo "executes in-container"
      - name: package (linux tarball — deploy-release.sh contract)
        run: |
          STAGE="hakobackend-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$STAGE"
          cp target/x86_64-unknown-linux-musl/release/hakobackend-server "$STAGE/hakobackend"
          cp hakobackend.example.toml "$STAGE/" 2>/dev/null || true
          (cd "$STAGE" && sha256sum * > SHA256SUMS)
          tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hakobackend-*-linux-x86_64.tar.gz
          generate_release_notes: true

      # TEMPORARY (prove-static): workflow artifact for manual download +
      # EL7 execution proof. Removed before merge.
      - name: test artifact (temporary)
        uses: actions/upload-artifact@v4
        with:
          name: hakobackend-linux-test
          path: hakobackend-*-linux-x86_64.tar.gz
