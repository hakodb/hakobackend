# Release: Windows server binary on every `v*` tag.
#
# Linux is DELIBERATELY absent: ubuntu-runner binaries need glibc 2.35+
# and OpenSSL 3, which do not run on EL8-class targets (proven at deploy:
# libssl.so.3 + GLIBC_2.30..2.38 missing). Linux binaries are built
# natively per target family (e.g. EL8 container) until a static/musl
# story lands — never ship an artifact that cannot run.
#
# No crates.io involved (13 path-crates would all need publishing, in
# order, on every change — pure churn for a binary people run).
# Distribution = GitHub Release assets here (+ GHCR images in docker.yml).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release --locked -p hakobackend-server --target ${{ matrix.target }}

      - name: package (windows)
        shell: pwsh
        run: |
          $STAGE = "hakobackend-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/hakobackend-server.exe" "$STAGE/hakobackend.exe"
          Copy-Item hakobackend.example.toml $STAGE -ErrorAction SilentlyContinue
          Compress-Archive $STAGE "$STAGE.zip"

      - name: upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            hakobackend-*.zip
          generate_release_notes: true
