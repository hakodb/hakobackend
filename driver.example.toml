# driver.example.toml — template manifest addon database baru.
# Salin ke crates/ub-db-<nama>/driver.toml lalu isi. Lihat DRIVER_CONTRACT.md.
[driver]
name = "ganti-nama-driver"
version = "0.1.0"
description = "Deskripsi singkat backend yang dibungkus"

[capabilities]
watch = false
transactions = false

[config]
# Contoh nilai database.path untuk driver ini:
path = "contoh-dsn-atau-path"
