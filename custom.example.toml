# custom.example.toml — `--auth ./custom.toml` template.
# Provider chain + claim-to-role mapping for your own free-form roles. No code.
# Copy then adjust. See AUTH_CONTRACT.md §4.

providers = ["github", "local"]

# DPoP mode for `local` members (off|accept|require; wins over UB_LOCAL_DPOP).
# dpop = "accept"

[mapping]
# uid_field = "sub"
# email_field = "email"

# Claim → role: matches when a string claim == equals or an array contains it.
[[rules]]
claim = "groups"
equals = "ops"
role = "pengurus"

# [[rules]]
# claim = "hd"
# equals = "sekolah.id"
# role = "guru"
