# policy.standard.toml — reference TEMPLATE for SECURITY_RULES.md, not binding rules.
# The role & collection names below are examples; change them freely via [identity].
# Copy to policy.toml then adjust per app.

# Your identity: which user collection, which role/owner fields.
[identity]
users_collection = "users"
role_field = "role"
owner_field = "ownerId"

[defaults]
read = "deny"
write = "deny"

# Public content: free reads, maintainer-role writes (role names are just examples).
[collections.posts]
read = "public"
create = "role:maintainer"
update = "role:maintainer"
delete = "role:admin"

[collections.pages]
read = "public"
write = "role:maintainer"

# Authenticated user uploads.
[collections.media]
read = "public"
create = "auth"
delete = "role:maintainer"

# Profiles: owners only.
[collections.profiles]
read = "owner"
write = "owner"
owner_field = "ownerId"

# Provider credentials / config: admins only (SECURITY_RULES §4).
[collections.ai_configs]
read = "role:admin"
write = "role:admin"

# Internal (__*) collections are not exposed over HTTP (enforced by the phase-2 server);
# listed here to stay explicit should an audit ever need it.
[collections.__users]
read = "deny"
write = "deny"
