# policy.standard.toml — reference TEMPLATE, not binding rules.
# Copy to policy.toml then adjust per app.
# Rules: public | auth | deny (owner/role removed with the tenant system).

# Your identity: which user collection holds login docs.
[identity]
users_collection = "users"

[defaults]
read = "deny"
write = "deny"

# Public content: free reads, authenticated writes.
[collections.posts]
read = "public"
create = "auth"
update = "auth"
delete = "auth"

[collections.pages]
read = "public"
write = "auth"

# Authenticated user uploads.
[collections.media]
read = "public"
create = "auth"
delete = "auth"

# Private data: authenticated callers only (per-user separation is the
# deployer's data modeling, or an external tenant layer).
[collections.profiles]
read = "auth"
write = "auth"

# Provider credentials / config: deny by default; open explicitly per app.
[collections.ai_configs]
read = "deny"
write = "deny"

# Internal (__*) collections are not exposed over HTTP (enforced by the server);
# listed here to stay explicit should an audit ever need it.
[collections.__users]
read = "deny"
write = "deny"
