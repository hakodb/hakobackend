# hakobackend.toml — hakobackend config. Copy to hakobackend.toml then adjust.
# Priority: CLI flags > this file > defaults. (--help for all flags)
host = "0.0.0.0"
port = 3000

# CHANGE DATABASE: edit 2 lines + POST /api/admin/reload. No rebuild.
# hako (default, embedded) | postgres | sqlite | mysql (rethink pending)
driver = "hako"
# file path (hako/sqlite) or DSN (postgres/mysql)
data = "./data/hako.ub"
# Co-located postgres/mysql: unix socket instead of TCP (measured
# +65-140% gateway RPS on weak CPUs — TCP stack is the cost, not the
# engine). Share the socket dir into the backend container, e.g.
# docker -v pg-sock:/var/run/postgresql, then:
# postgres: data = "postgres://user:pass@%2Fvar%2Frun%2Fpostgresql/dbname"
#   (host = percent-encoded socket DIR; sqlx uses it instead of TCP)
# mysql:    data = "mysql://user:pass@localhost/dbname?socket=/var/run/mysqld/mysqld.sock"
#   (dummy host required — empty host fails DSN parse; socket wins over TCP)

# Auth: off (default, dev) | local | chain:github,local | ./custom.toml.
# Unknown names fail fast at startup (fail-closed).
# `local` needs env UB_LOCAL_JWT_SECRET (min 32 random chars) + the
# /api/auth/register|login|refresh|logout|me endpoints go live automatically.
# auth = "off"

# Admin UIDs for /api/admin/* (repeatable; UIDs like "local:root").
# Empty = nobody (reload 403s). No roles in single-user backend.
# admin_uids = ["local:root"]

# Endpoint rules file. EDIT WHILE THE SERVER RUNS — applies immediately (hot-reload).
# Leave empty (= open dev mode) only for local development.
rules = "./policy.toml"

# Ready-made indexes: created at startup + reload (per-item failure = WARN).
# RULE: index every field you filter or order_by (nothing is inferred —
# unindexed order+limit is a full scan; see HTTP_CONTRACT §3).
# [[indexes]]
# collection = "posts"
# fields = ["age"]
# kind = "simple"  # simple | composite | fts
# [[indexes]]  # filter (status ==) + order (createdAt desc) in one walk
# collection = "posts"
# fields = ["status", "createdAt"]
# kind = "composite"

# In-process flood protection (no redis): req/min per IP + burst.
# /api/health is always open (probes); /api/auth/* gets the strict layer.
limit_global = 600
limit_global_burst = 100
limit_auth = 20
limit_auth_burst = 5
# trust_proxy = false  # true ONLY behind a proxy that strips X-Forwarded-For

# Unix-domain socket: extra local-only listener next to TCP (absent = TCP
# only). Same app; nginx: `proxy_pass http://unix:/run/hakobackend/hako.sock;`
# (upstream keepalive works over it). Bypasses the TCP loopback pps cap that
# bounds the proxy path. Created mode 777 (nginx user must write).
# Unix-only: a Windows build refuses to start with sock set.
# sock = "/run/hakobackend/hako.sock"

# Plain-TCP HTTP/2 (h2c, prior knowledge; default h1 = unchanged). Same app;
# multiplexing + HPACK helps header-heavy API traffic (Bearer JWTs). Ignored
# under TLS (ALPN already serves h2 there). Unix-only? No — works on Windows
# too (pure TCP). Changing it needs a restart.
# http2 = false

# Loopback service key: co-hosted consumer without user identity (e.g. a
# sibling service reading ai_configs under deny/deny). Static Bearer honored
# ONLY from 127.0.0.1/::1 (socket peer — spoof-proof behind nginx).
# Scope slots "collection:read|write" (read = Get+List), copied from here —
# the client cannot request scope. policy.toml stays untouched.
# Rotate without restart: add new key, POST /api/admin/reload, drop old.
# [service]
# keys = ["<64-hex>"]            # or UB_SVC_KEYS env (comma-separated)
# allow = ["ai_configs:read"]
