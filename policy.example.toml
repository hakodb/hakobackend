# policy.toml — endpoint rules. EDIT WHILE THE SERVER RUNS, applies immediately.
# Rule values: public | auth | owner | deny | role:<name>
# Per-collection slots: get list create update delete (optional), read/write fallback,
# final fallback [defaults]. Typo = deny (fail-closed).
# The `owner` slot checks the owner_field (default ownerId, fallback uid).

[defaults]
read = "public"
write = "deny"

[collections.posts]
read = "public"
create = "auth"
update = "auth"
delete = "role:maintainer"

[collections.profiles]
read = "owner"
write = "owner"
owner_field = "ownerId"

[collections.ai_configs]
read = "role:admin"
write = "role:admin"
