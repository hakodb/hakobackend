# policy.toml — endpoint rules. EDIT WHILE THE SERVER RUNS, applies immediately.
# Rule values: public | auth | deny
# Per-collection slots: get list create update delete (optional), read/write fallback,
# final fallback [defaults]. Typo = deny (fail-closed).

[defaults]
read = "public"
write = "deny"

[collections.posts]
read = "public"
create = "auth"
update = "auth"
delete = "auth"

[collections.profiles]
read = "auth"
write = "auth"

[collections.ai_configs]
read = "deny"
write = "deny"
