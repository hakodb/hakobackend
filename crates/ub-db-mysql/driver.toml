# Manifest addon driver MySQL/MariaDB (lihat DRIVER_CONTRACT.md).
[driver]
name = "mysql"
version = "0.1.0"
ub_core = "0.1"
description = "MySQL/MariaDB via sqlx (pool). Dialek JSON_UNQUOTE(JSON_EXTRACT) + kolom generated untuk FTS."

[capabilities]
watch = false            # polling oleh core
transactions = true
composite = true
fts = true               # FULLTEXT di atas kolom generated STORED (dikelola driver)
drop_index = true

[config]
# data = DSN, contoh: path = "mysql://user:pass@localhost:3306/ub"

[notes]
nested = "Subkoleksi diflatten (posts_revisions) + _collectionPath di JSON (dilepas saat baca)"
cursor = "startAt/startAfter/endAt/endBefore + offset didukung (CAST(? AS JSON) type-strict)"
compare = "JSON vs CAST(? AS JSON): type-strict lintas angka/string/bool (paritas kontrak)"
ne_null = "Ne atas field hilang = true (paritas kontrak) via OR ... IS NULL"
internal = "Koleksi/tabel prefix `__` (sesi, registry) + kolom `__fts_*` disembunyikan"
