# Manifest addon driver Postgres (lihat DRIVER_CONTRACT.md).
[driver]
name = "postgres"
version = "0.1.0"
ub_core = "0.1"
description = "PostgreSQL via sqlx (async native, pool). JSONB generik: id + data."

[capabilities]
watch = false            # polling oleh core (LISTEN/NOTIFY menyusul)
transactions = true      # engine mendukung; endpoint batch/tx menyusul
composite = true
fts = true               # GIN + to_tsvector('simple', ...)
drop_index = true

[config]
# data = DSN, contoh: path = "postgres://user:pass@localhost:5432/ub"

[notes]
nested = "Subkoleksi diflatten (posts_revisions) + _collectionPath di JSON (dilepas saat baca)"
cursor = "startAt/startAfter/endAt/endBefore + offset didukung (bound pada order_by[0]/id; NULL gugur otomatis)"
ordering = "ORDER BY native jsonb (homogen = identik kontrak; heterogen mengikuti PG)"
registry = "Nama index logis (kontrak) vs fisik DDL; index lama pra-kolom-ddl perlu dibuat ulang"
