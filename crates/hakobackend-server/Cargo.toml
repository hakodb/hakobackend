[package]
name = "hakobackend-server"
version = "0.1.5"
edition = "2021"

[dependencies]
hakobackend-core = { path = "../hakobackend-core" }
hakobackend-db-hako = { path = "../hakobackend-db-hako" }
hakobackend-policy = { path = "../hakobackend-policy" }
hakobackend-auth-core = { path = "../hakobackend-auth-core" }
hakobackend-auth-local = { path = "../hakobackend-auth-local" }
hakobackend-auth-github = { path = "../hakobackend-auth-github" }
hakobackend-auth-firebase = { path = "../hakobackend-auth-firebase" }
hakobackend-auth-oidc = { path = "../hakobackend-auth-oidc" }
hakobackend-db-postgres = { path = "../hakobackend-db-postgres" }
hakobackend-db-sqlite = { path = "../hakobackend-db-sqlite" }
hakobackend-db-mysql = { path = "../hakobackend-db-mysql" }
hakobackend-db-rethinkdb = { path = "../hakobackend-db-rethinkdb" }
hakobackend-ratelimit = { path = "../hakobackend-ratelimit" }
tokio = { workspace = true }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower-http = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
axum-server = { workspace = true }
rustls = { workspace = true }
tokio-stream = { workspace = true }
mime = { workspace = true }

# jemalloc only where it builds (Linux/macOS): MSVC is unsupported
# upstream. Windows keeps the system allocator.
[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { workspace = true }
