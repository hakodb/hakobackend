# Manifest addon driver SQLite (lihat DRIVER_CONTRACT.md).
[driver]
name = "sqlite"
version = "0.1.0"
ub_core = "0.1"
description = "SQLite via sqlx (file/in-memory). Nol-setup seperti hako, SQL portabel."

[capabilities]
watch = false            # polling oleh core
transactions = true
composite = true
fts = true               # FTS5 external-content + trigger sinkronisasi
drop_index = true

[config]
# data = path file (dibuat bila tak ada) atau :memory:
# contoh: path = "./data/ub.sqlite"

[notes]
nested = "Subkoleksi diflatten (posts_revisions) + _collectionPath di JSON (dilepas saat baca)"
cursor = "startAt/startAfter/endAt/endBefore + offset didukung (typed REAL/TEXT/INTEGER)"
ne_null = "Ne atas field hilang = true (paritas kontrak) via OR ... IS NULL"
numbers = "Angka diikat f64 (30 = 30.0 di sqlite — paritas numerik kontrak)"
internal = "Koleksi/tabel prefix `__` (sesi, registry, tabel FTS) disembunyikan dari list_collections"
object_eq = "Kesetaraan objek/array dalam filter = false (paritas JS legacy ===; PG jsonb deep-compare)"
