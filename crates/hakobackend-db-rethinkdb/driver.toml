# RethinkDB driver addon manifest (see DRIVER_CONTRACT.md).
# Status: SPIKE (unreql 0.2) — compiles + maps the full trait; live
# verification against a real server in progress.
[driver]
name = "rethinkdb"
version = "0.1.0"
hakobackend_core = "0.1"
description = "RethinkDB via unreql (ReQL). Native changefeeds for watch; emulated transactions."

[capabilities]
watch = true             # table.changes() push feed (dedicated session per table)
transactions = true      # EMULATED: validate + sequential apply + best-effort rollback (see notes/tx)
composite = false        # compound indexes need ReQL funcs (clear reject)
fts = false              # no FTS engine
drop_index = true
unique = false           # secondary indexes are never unique (clear reject)
named_index = true

[config]
# data = rethinkdb://[user[:pass]@]host[:port][/db] or bare host[:port][/db]
# (default localhost:28015, db from connect or "test").
# env: RETHINKDB_USER / RETHINKDB_PASSWORD win over the URL userinfo.
# example: path = "rethinkdb://db.internal:28015/hakobackend"

[notes]
tables = "Table names allow [A-Za-z0-9_] only: `-` -> `_d`, `/` -> `_s`, `_` -> `_u` (bijective codec, unit-tested)"
lists = "Table scan + core doc_matches/sort_and_limit (contract allows; pushdown is later work)"
writes = "insert conflict -> AlreadyExists; set = read + shallow-extend + replace (exact, like sqlite)"
missing_table = "Reads tolerate missing tables (Ok None/empty), like the other drivers"
tx = "EMULATED, not ACID: validate-all (must_exist aborts pre-write) + sequential apply with read-overlay + best-effort inverse rollback. Atomic except under concurrent conflicting writes mid-batch. Passes the shared conformance suite."
sessions = "One shared session for queries (auto-reconnect once on transport failure) + one dedicated session per changefeed (a dying feed must never poison queries — proven live)"
registry = "Index field map kept in __ub_indexes (server index_list is names-only)"
