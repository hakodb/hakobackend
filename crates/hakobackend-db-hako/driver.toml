# HakoDB driver addon manifest (see DRIVER_CONTRACT.md).
[driver]
name = "hako"
version = "0.1.0"
hakobackend_core = "0.1"
description = "Embedded document DB (crate hakodb) — default driver, zero-setup"

[capabilities]
watch = true
transactions = true
composite = true
fts = true
# drop_index = false: no drop-index API (reject clearly)
# unique = false: no unique constraints (reject clearly)
# named = false: custom names ignored, always auto (documented)

[config]
# path = database file; example: path = "./data/hako.ub"
path = "./data/hako.ub"

[notes]
sync_api = "HakoDB is synchronous; the adapter uses spawn_blocking (see src/lib.rs)"
cursor = "Native cursor works on sorted KEYS + full-scan pushes limit before manual sort (planner.rs:286) — both mismatch the contract. The adapter emulates cursor+offset+limit via contract helpers when a cursor OR order_by is present (full-scan cost); native limit/offset only for unordered lists"
