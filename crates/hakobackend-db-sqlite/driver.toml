# SQLite driver addon manifest (see DRIVER_CONTRACT.md).
[driver]
name = "sqlite"
version = "0.1.0"
hakobackend_core = "0.1"
description = "SQLite via sqlx (file/in-memory). Zero-setup like hako, portable SQL."

[capabilities]
watch = false            # polled by core
transactions = true
composite = true
fts = true               # FTS5 external-content + sync triggers
drop_index = true

[config]
# data = file path (created when absent) or :memory:
# example: path = "./data/ub.sqlite"
# durability: SQLITE_SYNCHRONOUS=full (default, fsync per commit) |
#   normal (HakoDB-Interval class: ack immediately, OS flushes on its own
#   schedule; never corrupt under WAL, power loss may drop last commits).
#   Measured sqlite/Windows/debug: ~180 -> ~410 rps PUT (A/B, same warm file).

[notes]
nested = "Subcollections flattened (posts_revisions) + _collectionPath in JSON (stripped on read)"
cursor = "startAt/startAfter/endAt/endBefore + offset supported (typed REAL/TEXT/INTEGER)"
ne_null = "Ne over a missing field = true (contract parity) via OR ... IS NULL"
numbers = "Numbers bind f64 (30 = 30.0 in sqlite — contract numeric parity)"
internal = "Collections/tables with the `__` prefix (sessions, registry, FTS tables) hidden from list_collections"
object_eq = "Object/array equality in filters = false (legacy JS === parity; PG jsonb deep-compares)"
