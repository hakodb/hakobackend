# Postgres driver addon manifest (see DRIVER_CONTRACT.md).
[driver]
name = "postgres"
version = "0.1.0"
hakobackend_core = "0.1"
description = "PostgreSQL via sqlx (native async, pool). Generic JSONB: id + data."

[capabilities]
watch = false            # polled by core (LISTEN/NOTIFY to follow)
transactions = true      # supported by the engine; batch/tx endpoints to follow
composite = true
fts = true               # GIN + to_tsvector('simple', ...)
drop_index = true

[config]
# data = DSN, example: path = "postgres://user:pass@localhost:5432/ub"

[notes]
nested = "Subcollections flattened (posts_revisions) + _collectionPath in JSON (stripped on read)"
cursor = "startAt/startAfter/endAt/endBefore + offset supported (bound on order_by[0]/id; NULL drops automatically)"
ordering = "Native jsonb ORDER BY (homogeneous = contract-identical; heterogeneous follows PG)"
registry = "Logical (contract) vs physical DDL index names; pre-ddl-column indexes need recreating"
