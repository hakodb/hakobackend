# hakobackend-server example config (phase 2+; phase 1 uses env UB_HAKO_PATH / UB_LISTEN)
[server]
listen = "0.0.0.0:3000"

[database]
# embedded default; options: postgres | mysql | sqlite
driver = "hako"
path = "./data/hako.ub"

[auth]
# mode = "internal" | "firebase" | "oidc" | "chain:firebase,internal"
mode = "internal"
access_ttl_secs = 600

# [[resources]] = optional per-collection declaration (hybrid; works without it)
# [[resources]]
# path = "posts"
# max_limit = 100
