# hakobackend-server example config (phase 2+; phase 1 uses env UB_HAKO_PATH / UB_LISTEN)
[server]
listen = "0.0.0.0:3000"

[database]
# embedded default; options: postgres | mysql | sqlite
driver = "hako"
path = "./data/hako.ub"

[auth]
# mode = "internal" | "firebase" | "oidc" | "chain:firebase,internal"
mode = "internal"
access_ttl_secs = 600

# [[resources]] = optional per-collection declaration (hybrid; works without it)
# [[resources]]
# path = "posts"
# max_limit = 100

# __backend reserved collection (issue #68): policy, path aliases and service
# keys can live as docs in the default database, overriding the file per
# section when present and valid (file stays bootstrap; secrets stay env-only;
# admin_uids stays file-only). Reload-driven via POST /api/admin/reload.
#
#   __backend/policy  = { "toml": "<policy.toml content>" }   (file watch disabled when adopted)
#   __backend/aliases = { "decl": [ { "pattern": "/api/alias/x/:id",
#                                     "target_path": "/api/collections/x",
#                                     "target_query": "" } ] }
#   __backend/service = { "keys": ["<hex>"], "allow": ["coll:read"] }
#
# Bootstrap: seed the docs while a policy file still grants write on
# __backend, or via the admin endpoint (the `__` prefix is reserved on the
# data plane):
#
#   GET    /api/admin/backend/{policy|aliases|service}
#   PUT    /api/admin/backend/{policy|aliases|service}   (validated, admin-only)
#   DELETE /api/admin/backend/{section}                  (rollback: file takes over on next reload)
#
# then POST /api/admin/reload — the DB sections take over.
